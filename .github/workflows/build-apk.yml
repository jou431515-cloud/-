name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk guitar-chords-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: guitar-chords-apk
          path: guitar-chords-*.apk

      # 휴대폰에서 바로 받을 수 있도록 Releases 페이지에도 올림
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 기타 코드 사전 v1.0.${{ github.run_number }}
          body: 아래 Assets 에서 .apk 파일을 받아 설치하세요.
          files: guitar-chords-*.apk
          make_latest: true
